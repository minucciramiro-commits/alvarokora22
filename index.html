<style>
body{margin:0;background:#060E0A}
a{color:#9BFFC4}a:hover{color:#20D872}
@property --n{syntax:'<integer>';inherits:false;initial-value:0}
.pg{--bg:#060E0A;--bg2:#040A07;--ink:#E3F1E8;--mut:rgba(227,241,232,.68);--dim:rgba(227,241,232,.5);--line:rgba(227,241,232,.10);--acc:#20D872;--glow:#9BFFC4;--acc-ink:#03140A;
container-type:inline-size;container-name:pg;position:relative;background:var(--bg);color:var(--ink);font-family:'Schibsted Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:clip;min-height:100vh}
.pg *{box-sizing:border-box}
:where(.pg) :where(h1,h2,h3,h4,p,ul,ol,li,figure,q){margin:0;padding:0}
:where(.pg) :where(ul,ol){list-style:none}
.pg a{color:inherit;text-decoration:none}
.pg button,.pg input,.pg select,.pg textarea{font-family:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1200px;margin:0 auto;padding:0 32px;position:relative;z-index:3}
.sec{position:relative;padding:150px 0}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-weight:600;font-size:12.5px;line-height:1;letter-spacing:.16em;text-transform:uppercase;color:var(--glow);padding:10px 15px;border-radius:999px;background:rgba(32,216,114,.07);border:1px solid rgba(32,216,114,.24)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 12px var(--acc);animation:blink 2s ease-in-out infinite;flex:none}
@keyframes blink{50%{opacity:.35}}
.h2{font-weight:800;font-size:min(5.6cqw,70px);line-height:1.02;letter-spacing:-.045em;text-wrap:balance;padding-bottom:.08em}
.light{font-weight:400;color:var(--mut)}
.lead{font-size:19px;line-height:1.6;color:var(--mut);max-width:640px;text-wrap:pretty}
.sec-hd{display:flex;flex-direction:column;gap:24px;align-items:flex-start;margin-bottom:64px}
.sec-hd.c{align-items:center;text-align:center}
.sec-hd.c .lead{margin:0 auto}
.grad{background:linear-gradient(180deg,#5E7468 0%,#D8F6E4 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.btn{position:relative;overflow:hidden;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;gap:10px;border-radius:999px;border:none;cursor:pointer;font-weight:700;font-size:15px;line-height:1.2;letter-spacing:.01em;padding:17px 30px;min-height:52px;background:var(--ink);color:var(--bg);transition:transform .35s cubic-bezier(.22,1,.36,1),box-shadow .4s,background .3s,border-color .3s}
.btn svg{transition:transform .35s cubic-bezier(.22,1,.36,1);flex:none}
.btn-acc{background:linear-gradient(180deg,#3BEA88,#16B95E);color:var(--acc-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 10px 30px -10px var(--acc)}
.btn-ghost{background:rgba(227,241,232,.03);color:var(--ink);border:1px solid rgba(227,241,232,.22)}
.btn-sm{padding:11px 20px;min-height:44px;font-size:14px}
.shine::after{content:'';position:absolute;top:-30%;bottom:-30%;left:-70%;width:45%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.65),transparent);transform:skewX(-22deg);opacity:0;pointer-events:none}
@media (hover:hover){.shine:hover::after{animation:sweep .95s cubic-bezier(.22,1,.36,1)}.btn:hover{transform:translateY(-2px)}.btn:hover svg{transform:translateX(4px)}
.btn-acc:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 0 0 1px rgba(155,255,196,.55),0 0 46px -4px var(--acc),0 18px 50px -12px var(--acc)}
.btn-ghost:hover{border-color:var(--acc);box-shadow:0 0 0 1px rgba(32,216,114,.35),0 0 34px -6px rgba(32,216,114,.7);color:#fff}}
@keyframes sweep{0%{left:-70%;opacity:1}100%{left:135%;opacity:1}}
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
.btn-acc::before,.btn-ghost::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:2px;background:conic-gradient(from var(--ang),transparent 0deg,transparent 220deg,rgba(155,255,196,.25) 260deg,#fff 320deg,var(--glow) 340deg,transparent 360deg);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spinRing 3.2s linear infinite;pointer-events:none;z-index:1}
.btn-acc::before{background:conic-gradient(from var(--ang),transparent 0deg,transparent 220deg,rgba(255,255,255,.35) 260deg,#fff 320deg,#EFFFF5 340deg,transparent 360deg)}
.btn-ghost{border-color:rgba(227,241,232,.14)}
@keyframes spinRing{to{--ang:360deg}}
.mag{display:inline-flex;will-change:transform}
.hero-ctas{gap:18px}
.glass{background:linear-gradient(180deg,rgba(227,241,232,.05),rgba(227,241,232,.015));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:inset 0 1px 1px rgba(255,255,255,.08),0 30px 80px -40px rgba(0,0,0,.85);position:relative;overflow:hidden}
.glass::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1.2px;background:linear-gradient(180deg,rgba(227,241,232,.42),rgba(227,241,232,.12) 22%,transparent 42%,transparent 60%,rgba(227,241,232,.1) 80%,rgba(227,241,232,.3));-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.shiny{background-image:linear-gradient(90deg,var(--ink) 10%,var(--glow) 28%,var(--acc) 45%,var(--glow) 60%,var(--ink) 80%);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:shiny 6s linear infinite}
@keyframes shiny{0%{background-position:200% center}100%{background-position:-200% center}}
.atmo{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(90px);animation:drift 20s ease-in-out infinite}
@keyframes drift{50%{transform:translate(-5%,4%) scale(1.1)}}
.gridbg{position:absolute;inset:0;background-image:linear-gradient(rgba(227,241,232,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(227,241,232,.045) 1px,transparent 1px);background-size:64px 64px;-webkit-mask:radial-gradient(ellipse 70% 55% at 50% 30%,#000,transparent 75%);mask:radial-gradient(ellipse 70% 55% at 50% 30%,#000,transparent 75%)}
.guides{position:absolute;inset:0;max-width:1200px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.ph{display:flex;align-items:center;justify-content:center;text-align:center;color:var(--dim);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;background:radial-gradient(ellipse at 30% 20%,rgba(32,216,114,.16),transparent 60%),repeating-linear-gradient(135deg,rgba(227,241,232,.035) 0 12px,transparent 12px 24px),#0A1610;padding:20px}
/* ===== entradas ===== */
.in{animation:fadeUp 1.1s cubic-bezier(.22,1,.36,1) both}
.d1{animation-delay:.1s}.d2{animation-delay:.25s}.d3{animation-delay:.9s}.d4{animation-delay:1.1s}.d5{animation-delay:1.35s}
@keyframes fadeUp{from{opacity:0;transform:translateY(28px);filter:blur(8px)}}
.wd{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .02em .1em;margin-bottom:-.1em}
.w{display:inline-block;animation:wordUp 1.1s cubic-bezier(.22,1,.36,1) var(--d) both}
.w.shiny{animation:wordUp 1.1s cubic-bezier(.22,1,.36,1) var(--d) both,shiny 6s linear infinite}
@keyframes wordUp{from{opacity:0;transform:translateY(105%) rotate(6deg);filter:blur(10px)}}
.zoomin{animation:zoomIn 1.6s cubic-bezier(.22,1,.36,1) 1.05s both}
@keyframes zoomIn{from{opacity:0;transform:scale(1.14);filter:blur(14px)}}
.js .rv,.js .rv-l,.js .rv-r,.js .rv-s,.js .rv-h{transition:opacity 1s cubic-bezier(.22,1,.36,1),transform 1.2s cubic-bezier(.22,1,.36,1),filter 1s cubic-bezier(.22,1,.36,1),clip-path 1.2s cubic-bezier(.22,1,.36,1)}
.js .rv{opacity:0;transform:translateY(64px);filter:blur(8px)}
.js .rv-l{opacity:0;transform:translateX(-90px)}
.js .rv-r{opacity:0;transform:translateX(90px)}
.js .rv-s{opacity:0;transform:translateY(56px) scale(.94);filter:blur(6px)}
.js .rv-h{opacity:0;transform:translateY(50px) skewY(3deg);transform-origin:0 100%;filter:blur(10px)}
.js .rv.on,.js .rv-l.on,.js .rv-r.on,.js .rv-s.on{opacity:1;transform:none;filter:blur(0)}
.js .rv-h.on{opacity:1;transform:none;filter:blur(0)}
.js .stg>*:nth-child(2){transition-delay:.09s}.js .stg>*:nth-child(3){transition-delay:.18s}.js .stg>*:nth-child(4){transition-delay:.27s}.js .stg>*:nth-child(5){transition-delay:.36s}.js .stg>*:nth-child(6){transition-delay:.45s}.js .stg>*:nth-child(7){transition-delay:.54s}.js .stg>*:nth-child(8){transition-delay:.63s}
.js .draw{stroke-dasharray:640;stroke-dashoffset:640;transition:stroke-dashoffset 2.2s cubic-bezier(.22,1,.36,1) .4s}.js .on .draw{stroke-dashoffset:0}
.js .grow{transform-origin:left;transform:scaleX(0);transition:transform 1.4s cubic-bezier(.22,1,.36,1) .5s}.js .on .grow{transform:scaleX(1)}
/* contadores */
.cnt{--n:var(--to);counter-reset:n var(--n)}
.cnt::before{content:counter(n)}
.cnt.dz::before{content:counter(n,decimal-leading-zero)}
.js .on .cnt-s{animation:cntUp 2.4s cubic-bezier(.22,1,.36,1) .3s both}
.pa .cnt-p{animation:cntUp 1.4s cubic-bezier(.22,1,.36,1) .1s both}.pb .cnt-p{animation:cntUp2 1.4s cubic-bezier(.22,1,.36,1) .1s both}
@keyframes cntUp2{from{--n:0}}
/* luz que sigue el mouse + partículas */
.cglow{position:absolute;left:0;top:0;width:760px;height:760px;margin:-380px 0 0 -380px;border-radius:50%;pointer-events:none;z-index:1;background:radial-gradient(circle,rgba(32,216,114,.17) 0%,rgba(32,216,114,.07) 35%,transparent 68%);transform:translate3d(var(--gx,50vw),var(--gy,300px),0);transition:transform .5s cubic-bezier(.22,1,.36,1),opacity .6s;opacity:var(--go,0);will-change:transform}
.parts{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1}
.parts-in{position:absolute;inset:0;transform:translate3d(calc(var(--mx,0) * -26px),calc(var(--my,0) * -18px),0);transition:transform .8s cubic-bezier(.22,1,.36,1)}
.pt{position:absolute;border-radius:50%;background:var(--glow);box-shadow:0 0 6px rgba(155,255,196,.8);opacity:.0;animation:ptFloat 10s ease-in-out infinite}
.pt.b{background:#fff;box-shadow:0 0 8px rgba(255,255,255,.7)}
@keyframes ptFloat{0%{opacity:0;transform:translateY(0)}20%{opacity:.75}55%{opacity:.25}80%{opacity:.6}100%{opacity:0;transform:translateY(-70px)}}
.case.act .cnt-c{animation:cntUp 1.5s cubic-bezier(.22,1,.36,1) .15s both}
@keyframes cntUp{from{--n:0}}
/* ===== nav ===== */
.nav{position:sticky;top:0;z-index:60;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);background:linear-gradient(180deg,rgba(6,14,10,.82),rgba(6,14,10,.55));border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;justify-content:space-between;gap:24px;height:76px}
.logo{display:inline-flex;align-items:center;gap:12px;font-weight:800;font-size:19px;letter-spacing:-.03em}
.logo-m{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(140deg,#3BEA88,#0E8F47);color:var(--acc-ink);font-weight:900;font-size:17px;box-shadow:0 0 24px -4px var(--acc)}
.nav-l{display:flex;gap:36px;font-weight:500;font-size:15px;color:var(--mut)}
.nav-l a{position:relative;padding:8px 0;transition:color .25s}
.nav-l a::after{content:'';position:absolute;left:0;right:0;bottom:2px;height:1.5px;background:var(--acc);transform:scaleX(0);transform-origin:right;transition:transform .45s cubic-bezier(.22,1,.36,1)}
.nav-l a:hover{color:var(--ink)}.nav-l a:hover::after{transform:scaleX(1);transform-origin:left}
/* ===== hero ===== */
.hero{position:relative;padding:96px 0 40px;text-align:center}
.hero-in{display:flex;flex-direction:column;align-items:center;gap:30px}
.h1{font-weight:800;font-size:min(8.2cqw,118px);line-height:.98;letter-spacing:-.058em;max-width:1120px;text-wrap:balance}
.hero-sub{font-size:20px;line-height:1.6;color:var(--mut);max-width:760px;text-wrap:pretty}
.hero-sub b{color:var(--ink);font-weight:600}
.sub-m{display:none}
.hv-out{width:100%;max-width:1040px;margin-top:22px;perspective:1400px}
.hv-tilt{transform:rotateX(calc(14deg - min(var(--sy,0),520) / 520 * 14deg)) scale(calc(.92 + min(var(--sy,0),520) / 520 * .08));transform-origin:50% 0;will-change:transform}
.hv{border-radius:28px;aspect-ratio:16/9;display:grid;place-items:center;box-shadow:0 60px 140px -50px rgba(32,216,114,.45),0 30px 80px -40px #000}
.hv-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.42;filter:saturate(.85);transition:opacity .6s,transform 1.2s cubic-bezier(.22,1,.36,1)}
.hv-sh{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(6,14,10,.15),rgba(6,14,10,.75) 85%);pointer-events:none}
.hv:hover .hv-img{opacity:.55;transform:scale(1.03)}
.play{position:relative;z-index:2;width:104px;height:104px;border-radius:50%;border:none;cursor:pointer;display:grid;place-items:center;background:linear-gradient(180deg,#3BEA88,#16B95E);color:var(--acc-ink);box-shadow:0 0 0 0 rgba(32,216,114,.55);animation:pulse 2.2s infinite;transition:transform .4s cubic-bezier(.22,1,.36,1)}
.play:hover{transform:scale(1.08)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(32,216,114,.55)}70%{box-shadow:0 0 0 34px rgba(32,216,114,0)}100%{box-shadow:0 0 0 0 rgba(32,216,114,0)}}
.hv-tag{position:absolute;top:22px;left:22px;z-index:2;display:inline-flex;gap:8px;align-items:center;font-size:12.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:9px 13px;border-radius:999px;background:rgba(6,14,10,.6);border:1px solid var(--line)}
.hv-bar{position:absolute;left:22px;right:22px;bottom:20px;height:4px;border-radius:9px;background:rgba(227,241,232,.12);overflow:hidden;z-index:2}
.hv-bar i{display:block;height:100%;width:34%;background:linear-gradient(90deg,var(--acc),var(--glow));box-shadow:0 0 14px var(--acc);animation:vbar 9s linear infinite}
@keyframes vbar{from{transform:translateX(-100%)}to{transform:translateX(300%)}}
.hero-ctas{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:8px}
/* ===== demo ===== */
.demo{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:22px;align-items:stretch}
.chat{border-radius:28px;display:flex;flex-direction:column}
.chat-hd{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line);font-weight:600;font-size:14.5px}
.chat-lg{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:#1A2A21;color:var(--glow)}
.live{margin-left:auto;display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--glow)}
.chat-bd{display:flex;flex-direction:column;gap:16px;padding:26px 24px;flex:1}
.msg{max-width:84%;border-radius:20px;padding:14px 18px;font-size:15.5px;line-height:1.55}
.msg.u{align-self:flex-end;background:linear-gradient(180deg,#1E3A2B,#15291E);border:1px solid rgba(32,216,114,.25);border-bottom-right-radius:6px}
.msg.c{align-self:flex-start;background:rgba(227,241,232,.045);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.c b,.chat b{color:var(--glow);font-weight:700}
.who{display:block;font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.dots{display:none;gap:6px;padding:6px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--glow);animation:dotb 1s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dotb{50%{transform:translateY(-5px);opacity:.4}}
.cl-b{display:grid;grid-template-rows:1fr}
.cl-in{overflow:hidden;display:flex;flex-direction:column;gap:10px}
.ad{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:11px 14px;border-radius:12px;background:rgba(6,14,10,.55);border:1px solid var(--line);font-size:14.5px}
.ad .z{color:#FF8A7A;font-weight:600}
.status{align-self:flex-start;display:inline-flex;align-items:center;gap:10px;padding:12px 16px;border-radius:999px;background:rgba(32,216,114,.12);border:1px solid rgba(32,216,114,.4);color:var(--glow);font-weight:600;font-size:14.5px;box-shadow:0 0 30px -8px var(--acc)}
.chat-bd{min-height:500px}
.cpop{animation:cPop .6s cubic-bezier(.22,1,.36,1) both}
.spop{animation:sPop .8s cubic-bezier(.34,1.56,.64,1) both}
@keyframes cPop{from{opacity:0;transform:translateY(16px) scale(.97);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
@keyframes sPop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.caret{display:inline-block;width:2px;height:1.05em;margin-left:2px;vertical-align:-.15em;background:var(--glow);animation:blink .8s steps(2) infinite}
.tdots{display:flex;gap:6px;padding:8px 0}
.tdots i{width:8px;height:8px;border-radius:50%;background:var(--glow);animation:dotb 1s ease-in-out infinite}
.tdots i:nth-child(2){animation-delay:.15s}.tdots i:nth-child(3){animation-delay:.3s}
.chat-ft{padding:16px 22px;border-top:1px solid var(--line);font-size:14px;color:var(--mut);display:flex;align-items:center;gap:10px}
.js .chat .ap,.js .chat .ln{opacity:0}
.chat.on .ap{animation:pop .7s cubic-bezier(.22,1,.36,1) var(--d) both}
.chat.on .ln{animation:lnIn .7s cubic-bezier(.22,1,.36,1) var(--d) both}
.js .chat .ch{opacity:0}
.chat.on .ch{animation:chIn .05s linear both}
.js .chat .dots{display:flex;opacity:0;max-height:0;overflow:hidden}
.chat.on .dots{animation:dotsVis 1.4s 1.95s both}
.js .chat .cl-b{grid-template-rows:0fr}
.chat.on .cl-b{animation:expand .8s cubic-bezier(.22,1,.36,1) 3.2s both}
.chat.on .status{animation:popS .8s cubic-bezier(.34,1.56,.64,1) var(--d) both}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}
@keyframes popS{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes lnIn{from{opacity:0;transform:translateY(10px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
@keyframes chIn{from{opacity:0}to{opacity:1}}
@keyframes dotsVis{0%{opacity:0;max-height:20px}15%{opacity:1;max-height:20px}85%{opacity:1;max-height:20px}100%{opacity:0;max-height:0}}
@keyframes expand{from{grid-template-rows:0fr}to{grid-template-rows:1fr}}
.side{display:flex;flex-direction:column;gap:22px}
.met{border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:10px;flex:1}
.met-k{font-size:12.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.met-v{font-weight:800;font-size:44px;letter-spacing:-.04em;line-height:1}
.met-s{font-size:14px;color:var(--mut)}
.met-s b{color:var(--glow)}
.up{color:var(--acc);font-weight:700}
.mbar{height:8px;border-radius:9px;background:rgba(227,241,232,.08);overflow:hidden}
.mbar i{display:block;height:100%;width:38%;border-radius:9px;background:linear-gradient(90deg,#FF8A7A,#FFB199)}
/* ===== cifras ===== */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:110px}
.stat{padding:46px 34px;display:flex;flex-direction:column;gap:12px}
.stat+.stat{border-left:1px solid var(--line)}
.stat-n{font-weight:800;font-size:min(7.4cqw,96px);letter-spacing:-.06em;line-height:.9;color:var(--ink)}
.stat-n small{font-size:.42em;letter-spacing:-.02em;color:var(--acc);margin-left:6px}
.stat-t{font-size:16px;color:var(--mut);max-width:260px}
/* ===== marquee scroll ===== */
.mq{padding:120px 0 40px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.mrow{display:flex;gap:14px;width:max-content;will-change:transform}
.mrow.r1{transform:translateX(calc(var(--mo,0) * 1px - 520px))}
.mrow.r2{transform:translateX(calc(var(--mo,0) * -1px - 60px))}
.tile{flex:none;height:132px;border-radius:24px;padding:0 38px;display:flex;align-items:center;gap:18px;font-weight:800;font-size:46px;letter-spacing:-.04em;white-space:nowrap}
.tile.o{color:transparent;-webkit-text-stroke:1.4px rgba(227,241,232,.55)}
.tile.g{background:linear-gradient(140deg,rgba(32,216,114,.22),rgba(32,216,114,.04));border:1px solid rgba(32,216,114,.3)}
.tile-c{flex:none;height:132px;border-radius:24px;padding:0 34px;display:flex;align-items:center;gap:22px;white-space:nowrap}
.tile-c b{font-weight:800;font-size:52px;letter-spacing:-.05em;color:var(--acc)}
.tile-c span{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:20px}
.tile-c small{font-weight:500;font-size:13.5px;color:var(--dim)}
/* ===== empezar ===== */
.pick{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:22px;align-items:stretch}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;align-items:center;gap:18px;text-align:left;width:100%;padding:22px 24px;border-radius:20px;border:1px solid var(--line);background:rgba(227,241,232,.025);color:var(--ink);cursor:pointer;font-size:18px;font-weight:600;transition:all .4s cubic-bezier(.22,1,.36,1)}
.opt:hover{border-color:rgba(32,216,114,.45);transform:translateX(6px)}
.opt .on-n{font-size:13px;font-weight:700;color:var(--dim);letter-spacing:.1em;min-width:26px}
.opt .chev{margin-left:auto;opacity:.3;transition:all .4s}
.opt.sel{background:linear-gradient(100deg,rgba(32,216,114,.18),rgba(32,216,114,.03));border-color:rgba(32,216,114,.6);box-shadow:0 0 40px -14px var(--acc)}
.opt.sel .on-n{color:var(--acc)}.opt.sel .chev{opacity:1;color:var(--acc);transform:translateX(4px)}
.pnl{border-radius:30px;padding:44px;display:flex;flex-direction:column;gap:22px}
.pa{animation:pnlA .7s cubic-bezier(.22,1,.36,1) both}.pb{animation:pnlB .7s cubic-bezier(.22,1,.36,1) both}
@keyframes pnlA{from{opacity:0;transform:translateY(22px);filter:blur(6px)}}
@keyframes pnlB{from{opacity:0;transform:translateY(22px);filter:blur(6px)}}
.pnl-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 13px;border-radius:999px;font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);color:var(--mut)}
.price{font-weight:800;font-size:54px;letter-spacing:-.05em;line-height:1;color:var(--acc);text-align:right}
.price small{display:block;font-size:14px;letter-spacing:0;font-weight:500;color:var(--dim);margin-top:8px}
.pnl h3{font-weight:800;font-size:36px;letter-spacing:-.035em;line-height:1.08}
.pts{display:flex;flex-direction:column;gap:14px}
.pts li{display:flex;gap:14px;align-items:flex-start;font-size:16.5px;line-height:1.5;color:var(--mut)}
.ck{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:rgba(32,216,114,.14);color:var(--acc)}
/* ===== MER ===== */
.mer{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
.mer-in{border-radius:30px;padding:40px;display:flex;flex-direction:column;gap:34px}
.fld{display:flex;flex-direction:column;gap:14px}
.fld-t{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:15px;color:var(--mut);font-weight:500}
.fld-t output{font-weight:800;font-size:28px;letter-spacing:-.03em;color:var(--ink)}
.rng{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:9px;outline:none;cursor:pointer;background:linear-gradient(90deg,var(--acc) 0,var(--glow) var(--v),rgba(227,241,232,.1) var(--v))}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;border:6px solid var(--acc);box-shadow:0 0 0 6px rgba(32,216,114,.18),0 0 24px var(--acc);transition:transform .2s}
.rng::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:6px solid var(--acc);box-shadow:0 0 0 6px rgba(32,216,114,.18)}
.rng:active::-webkit-slider-thumb{transform:scale(1.15)}
.rng:focus-visible{box-shadow:0 0 0 3px rgba(155,255,196,.5)}
.mer-out{border-radius:30px;padding:40px;display:flex;flex-direction:column;gap:26px}
.res{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.res div{display:flex;flex-direction:column;gap:8px}
.res span{font-size:12.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.res b{font-weight:800;font-size:40px;letter-spacing:-.045em;line-height:1}
.res .hl{color:var(--acc)}
.bars{display:flex;flex-direction:column;gap:14px}
.bar-r{display:grid;grid-template-columns:100px minmax(0,1fr);gap:14px;align-items:center;font-size:14px;color:var(--mut)}
.bar-t{height:34px;border-radius:10px;background:rgba(227,241,232,.05);overflow:hidden}
.bar-t i{display:block;height:100%;border-radius:10px;transition:width .6s cubic-bezier(.22,1,.36,1)}
.bar-t .b1{background:linear-gradient(90deg,#2F4A3B,#5E8A72)}
.bar-t .b2{background:linear-gradient(90deg,#16B95E,#3BEA88);box-shadow:0 0 24px -4px var(--acc)}
.verd{border-radius:18px;padding:20px 22px;font-size:16px;line-height:1.55;border:1px solid var(--line);background:rgba(227,241,232,.03);transition:all .5s}
.verd.hot{border-color:rgba(255,138,122,.45);background:rgba(255,138,122,.07)}
.verd.ok{border-color:rgba(32,216,114,.45);background:rgba(32,216,114,.07)}
/* ===== casos ===== */
.car-hd{display:flex;justify-content:space-between;align-items:flex-end;gap:30px;flex-wrap:wrap;margin-bottom:56px}
.ctrls{display:flex;gap:10px}
.cbtn{min-height:48px;padding:0 20px;border-radius:999px;border:1px solid rgba(227,241,232,.22);background:transparent;color:var(--ink);font-weight:600;font-size:14.5px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:all .3s}
.cbtn:hover{border-color:var(--acc);box-shadow:0 0 30px -8px var(--acc)}
.car{overflow:hidden;margin:0 -8px;padding:8px}
.track{--cw:min(440px,78cqw);display:flex;gap:20px;transform:translateX(calc(var(--i) * -1 * (var(--cw) + 20px)));transition:transform 1.1s cubic-bezier(.22,1,.36,1)}
.case{flex:none;width:var(--cw);border-radius:30px;padding:34px;display:flex;flex-direction:column;gap:18px;opacity:.42;transform:scale(.95);transition:opacity .8s,transform .9s cubic-bezier(.22,1,.36,1)}
.case.act{opacity:1;transform:none}
.case-fig{font-weight:800;font-size:110px;letter-spacing:-.07em;line-height:.9;color:var(--acc);text-shadow:0 0 50px rgba(32,216,114,.35)}
.case h3{font-weight:800;font-size:28px;letter-spacing:-.03em}
.case p{font-size:16px;line-height:1.55;color:var(--mut)}
.case .cap{height:130px;border-radius:18px;font-size:11.5px}
.cdots{display:flex;gap:8px;margin-top:34px}
.cdot{width:34px;height:4px;border-radius:9px;border:none;padding:0;background:rgba(227,241,232,.15);cursor:pointer;transition:all .5s}
.cdot.sel{width:68px;background:var(--acc);box-shadow:0 0 14px var(--acc)}
/* ===== capturas reales ===== */
.proof{margin-top:70px}
.proof-t{display:inline-flex;align-items:center;gap:10px;font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--glow)}
.pmq{position:relative;z-index:3;overflow:hidden;padding:46px 0 30px;margin-top:-20px;-webkit-mask:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.pmq-track{display:flex;gap:28px;width:max-content;align-items:center;animation:marq 46s linear infinite}
.pmq:hover .pmq-track{animation-play-state:paused}
.shot{flex:none;margin:0;padding:10px;border-radius:22px;background:#fff;box-shadow:0 0 0 1px rgba(32,216,114,.25),0 30px 70px -30px rgba(0,0,0,.9),0 0 60px -20px rgba(32,216,114,.45);transform:rotate(var(--r));transition:transform .6s cubic-bezier(.22,1,.36,1),box-shadow .6s}
.shot img{display:block;height:300px;width:auto;border-radius:14px}
.shot:hover{transform:rotate(0deg) scale(1.06) translateY(-8px);box-shadow:0 0 0 2px var(--acc),0 40px 90px -30px rgba(0,0,0,.9),0 0 80px -10px var(--acc)}
@keyframes marq{to{transform:translateX(-50%)}}
@container pg (max-width:820px){.shot img{height:210px}.pmq-track{gap:18px}.proof{margin-top:50px}}
/* ===== fases (stack) ===== */
.stack{position:relative;padding-left:70px}
.sline{position:absolute;left:12px;top:0;bottom:0;width:2px;background:var(--line)}
.sline i{position:absolute;inset:0;transform-origin:top;transform:scaleY(var(--sp,0));background:linear-gradient(var(--glow),var(--acc));box-shadow:0 0 18px var(--acc)}
.node{position:absolute;left:-6px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:2px solid var(--acc);opacity:calc(.25 + .75 * clamp(0, (var(--sp,0) * 4.2 - var(--i)) * 3, 1));box-shadow:0 0 16px var(--acc)}
.stk{height:560px}
.stk:last-child{height:440px}
.fcard{position:sticky;top:calc(130px + var(--i) * 30px);transform:scale(var(--sc,1));transform-origin:50% 0;filter:brightness(calc(1 - var(--dk,0) * .45));border-radius:44px;background:linear-gradient(160deg,#0D1C14,#08130D);border:1.5px solid rgba(227,241,232,.22);padding:46px 52px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:46px;align-items:center;min-height:380px;box-shadow:0 -30px 80px -40px rgba(0,0,0,.9)}
.fnum{font-weight:900;font-size:min(13cqw,190px);letter-spacing:-.07em;line-height:.8}
.fcard h3{font-weight:800;font-size:46px;letter-spacing:-.04em;margin-bottom:16px}
.fcard p{font-size:19px;line-height:1.6;color:var(--mut);max-width:560px}
.ftag{display:inline-flex;margin-bottom:20px}
/* ===== light (cómo empezamos) ===== */
.lsec{position:relative;z-index:4;background:#F2F7F3;color:#07100B;border-radius:64px 64px 0 0;padding:140px 0 200px}
.lsec .eyebrow{color:#0B7A3E;background:rgba(11,122,62,.08);border-color:rgba(11,122,62,.25)}
.lsec .light{color:rgba(7,16,11,.55)}
.lsec .lead{color:rgba(7,16,11,.66)}
.steps{max-width:1040px;margin:0 auto}
.step{display:grid;grid-template-columns:200px minmax(0,1fr);gap:36px;align-items:center;padding:42px 0;border-top:1px solid rgba(7,16,11,.14)}
.step:last-child{border-bottom:1px solid rgba(7,16,11,.14)}
.step-n{font-weight:900;font-size:min(10cqw,140px);letter-spacing:-.07em;line-height:.85;color:#07100B;transition:color .4s}
.step:hover .step-n{color:#16B95E}
.step h3{font-weight:600;font-size:min(2.4cqw,32px);text-transform:uppercase;letter-spacing:.01em;margin-bottom:10px;display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.step h3 small{font-size:15px;font-weight:600;text-transform:none;letter-spacing:0;color:#0B7A3E;background:rgba(11,122,62,.09);padding:6px 11px;border-radius:999px}
.step p{font-size:18px;line-height:1.6;color:rgba(7,16,11,.62);max-width:640px}
.note{display:flex;gap:14px;align-items:center;padding:18px 22px;border-radius:18px;background:#fff;border:1px solid rgba(7,16,11,.1);font-size:16px;font-weight:500;max-width:720px;margin:0 auto 70px;box-shadow:0 20px 50px -30px rgba(7,16,11,.25)}
.lsec .src{font-size:13.5px;color:rgba(7,16,11,.5)}
/* ===== vídeos ===== */
.dsec{position:relative;z-index:5;background:var(--bg);border-radius:64px 64px 0 0;margin-top:-64px}
.vids{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.vid{border-radius:26px;display:flex;flex-direction:column;transition:transform .5s cubic-bezier(.22,1,.36,1)}
.vid:hover{transform:translateY(-8px)}
.vth{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:26px 26px 0 0}
.vimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform .9s cubic-bezier(.22,1,.36,1),filter .6s}
.vid:hover .vimg{transform:scale(1.07);filter:brightness(.7)}
.vsh{position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(6,14,10,.35));pointer-events:none}
.vpl{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;display:grid;place-items:center;background:var(--acc);color:var(--acc-ink);opacity:0;transform:scale(.6);transition:transform .45s cubic-bezier(.34,1.56,.64,1),opacity .3s;box-shadow:0 0 0 10px rgba(32,216,114,.2),0 0 40px -2px var(--acc)}
.vid:hover .vpl,.vid:focus-visible .vpl{opacity:1;transform:scale(1)}
.vbd{padding:22px 24px 26px;display:flex;flex-direction:column;gap:12px}
.vbd h3{font-weight:700;font-size:19px;line-height:1.35;letter-spacing:-.015em}
.vbd .chip{align-self:flex-start;color:var(--glow);border-color:rgba(32,216,114,.3)}
.more{display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:17px;margin-top:46px;color:var(--glow)}
.more:hover{color:var(--acc)}
/* ===== quién soy ===== */
.about{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:70px;align-items:start}
.ph-wrap{position:sticky;top:120px;border-radius:36px;overflow:hidden;aspect-ratio:4/5}
.ph-wrap .ph{position:absolute;inset:-10% 0;font-size:13px}
.par2{transform:translateY(calc(var(--p,0) * -60px))}
.ph-fade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(6,14,10,.9));pointer-events:none}
.ph-cap{position:absolute;left:24px;bottom:22px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
.about-r{display:flex;flex-direction:column;gap:34px}
.rvl{font-size:min(2.1cqw,27px);line-height:1.5;font-weight:500;letter-spacing:-.012em}
.rvl .c{opacity:calc(.14 + .86 * clamp(0, (var(--rp,0) * (var(--n) + 40) - var(--i)) / 40, 1))}
.pg:not(.js) .rvl .c{opacity:1}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.fact{border-radius:22px;padding:22px 24px;display:flex;flex-direction:column;gap:6px}
.fact b{font-weight:800;font-size:30px;letter-spacing:-.04em;color:var(--acc)}
.fact span{font-size:15px;color:var(--mut)}
.tests{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:90px}
.test{border-radius:26px;padding:30px;display:flex;flex-direction:column;gap:22px;transition:transform .5s cubic-bezier(.22,1,.36,1)}
.test:hover{transform:translateY(-6px)}
.test q{font-weight:700;font-size:26px;line-height:1.2;letter-spacing:-.03em;quotes:'“' '”'}
.test .by{display:flex;gap:12px;align-items:center;font-size:14.5px;color:var(--mut)}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(32,216,114,.15);color:var(--glow);font-weight:800}
.wmk{position:absolute;left:0;right:0;top:40px;white-space:nowrap;font-weight:900;font-size:min(19cqw,280px);letter-spacing:-.06em;line-height:1;color:transparent;-webkit-text-stroke:1.2px rgba(227,241,232,.07);pointer-events:none;z-index:1;transform:translateX(calc(var(--p,0) * 14%))}
/* ===== newsletter ===== */
.nl{border-radius:40px;padding:70px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:50px;align-items:center}
.nl-f{display:flex;flex-direction:column;gap:14px}
.inp-row{display:flex;gap:10px;padding:8px;border-radius:999px;background:rgba(6,14,10,.6);border:1px solid rgba(227,241,232,.18);transition:border-color .3s,box-shadow .3s}
.inp-row:focus-within{border-color:var(--acc);box-shadow:0 0 0 4px rgba(32,216,114,.15)}
.inp-row input{flex:1;min-width:0;background:transparent;border:none;outline:none;color:var(--ink);font-size:16px;padding:0 18px}
.legal{font-size:13.5px;color:var(--dim)}
.okmsg{display:flex;gap:12px;align-items:center;padding:20px 22px;border-radius:20px;background:rgba(32,216,114,.1);border:1px solid rgba(32,216,114,.4);color:var(--glow);font-weight:600;animation:popS .7s cubic-bezier(.34,1.56,.64,1) both}
/* ===== agenda ===== */
.steps-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.sb{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;font-size:13px;font-weight:600;border:1px solid var(--line);color:var(--dim);transition:all .4s}
.sb.sel{color:var(--acc-ink);background:var(--acc);border-color:var(--acc)}
.sb.dn{color:var(--glow);border-color:rgba(32,216,114,.4)}
.book{border-radius:34px;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.15fr) minmax(0,.85fr)}
.bk-col{padding:34px;display:flex;flex-direction:column;gap:16px}
.bk-col+.bk-col{border-left:1px solid var(--line)}
.bk-t{font-size:12.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.btype{text-align:left;width:100%;padding:20px;border-radius:20px;border:1px solid var(--line);background:rgba(227,241,232,.02);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:all .35s}
.btype:hover{border-color:rgba(32,216,114,.45)}
.btype.sel{border-color:var(--acc);background:rgba(32,216,114,.08);box-shadow:0 0 34px -12px var(--acc)}
.btype b{font-size:17px;font-weight:700}
.btype .meta{display:flex;gap:8px;flex-wrap:wrap}
.btype .meta span{font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:999px;background:rgba(227,241,232,.06);color:var(--mut)}
.btype.sel .meta .pr{background:var(--acc);color:var(--acc-ink)}
.btype p{font-size:14px;line-height:1.5;color:var(--mut)}
.cal-hd{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cal-hd b{font-size:18px;font-weight:700;text-transform:capitalize}
.ib{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;display:grid;place-items:center;transition:all .3s}
.ib:hover:not(:disabled){border-color:var(--acc)}
.ib:disabled{opacity:.3;cursor:default}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center}
.wk{font-size:12px;font-weight:700;color:var(--dim);padding:6px 0}
.day{aspect-ratio:1;border-radius:50%;border:none;background:rgba(32,216,114,.1);color:var(--glow);font-weight:700;font-size:15px;cursor:pointer;transition:all .3s;min-height:38px}
.day:hover:not(:disabled){background:rgba(32,216,114,.25)}
.day:disabled{background:transparent;color:rgba(227,241,232,.25);cursor:default;font-weight:500}
.day.full{background:transparent;color:var(--mut);text-decoration:line-through;text-decoration-color:rgba(227,241,232,.3)}
.day.sel{background:var(--acc);color:var(--acc-ink);box-shadow:0 0 24px -4px var(--acc)}
.day.blank{visibility:hidden}
.tz{font-size:13.5px;color:var(--dim);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.lnk{background:none;border:none;color:var(--glow);font-weight:600;font-size:13.5px;cursor:pointer;padding:4px;text-decoration:underline;text-underline-offset:3px}
.hrs{display:flex;flex-direction:column;gap:10px;max-height:420px;overflow:auto}
.hr-r{display:flex;gap:8px}
.hr{flex:1;min-height:48px;border-radius:14px;border:1px solid rgba(32,216,114,.45);background:transparent;color:var(--glow);font-weight:700;font-size:15.5px;cursor:pointer;transition:all .3s}
.hr:hover{background:rgba(32,216,114,.1)}

<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { pick: 2, pA: 0, fact: 40000, inv: 12000, roas: 4.2, slide: 0, hover: false, faq: 0, sub: false, bType: 1, mOff: 0, sel: null, slot: null, step: 2 };
  }
  componentDidMount() {

  }
  componentDidUpdate() { this.scanMotion(); }
  componentWillUnmount() {
    clearInterval(this.scan); clearInterval(this.auto);
    (this.chatTimers || []).forEach(clearTimeout);
    this.lqDead = true; (this.lqClean || []).forEach(f => f());
    this.io && this.io.disconnect();
    if (this.onScroll) { document.removeEventListener('scroll', this.onScroll, { capture: true }); window.removeEventListener('resize', this.onScroll); }
    if (this.onMove) document.removeEventListener('pointermove', this.onMove);
  }
  scanMotion() {
    const root = this.rootEl;
    if (!root) return;
    if (!('IntersectionObserver' in window)) { root.querySelectorAll('.rv,.rv-l,.rv-r,.rv-s,.rv-h').forEach(el => el.classList.add('on')); return; }
    if (!this.io) {
      this.io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { this.shown.add(e.target); e.target.classList.add('on'); this.io.unobserve(e.target); } }), { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });
      this.setupMotion(root);
    }
    root.classList.add('js');
    if (this.chatEl && !this.chatRun) { const c = this.chatEl.closest('.chat'); if (c && c.classList.contains('on')) this.startChat(); }
    root.querySelectorAll('.rv,.rv-l,.rv-r,.rv-s,.rv-h').forEach(el => {
      if (this.shown.has(el)) { el.classList.add('on'); return; }
      if (!this.watched.has(el)) { this.watched.add(el); this.io.observe(el); }
    });
  }
  setupMotion(root) {
    let raf = 0;
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const update = () => {
      raf = 0;
      const t = this.scroller && this.scroller !== document ? this.scroller.scrollTop : (window.scrollY || 0);
      root.style.setProperty('--sy', String(Math.min(t, 1400)));
      const vh = window.innerHeight || 800;
      // respaldo: revela por posición aunque el IntersectionObserver no dispare (Safari, iframes, etc.)
      root.querySelectorAll('.rv:not(.on),.rv-l:not(.on),.rv-r:not(.on),.rv-s:not(.on),.rv-h:not(.on)').forEach(el => {
        const r = el.getBoundingClientRect();

      });
      root.querySelectorAll('[data-par]').forEach(el => { const r = el.getBoundingClientRect(); const p = ((r.top + r.height / 2) - vh / 2) / vh; el.style.setProperty('--p', clamp(p, -1.2, 1.2).toFixed(4)); });
      root.querySelectorAll('[data-marq]').forEach(el => { const r = el.getBoundingClientRect(); el.style.setProperty('--mo', clamp((vh - r.top) * 0.32, 0, 900).toFixed(1)); });
      root.querySelectorAll('[data-reveal]').forEach(el => { const r = el.getBoundingClientRect(); const p = (vh * 0.85 - r.top) / (r.height + vh * 0.55); el.style.setProperty('--rp', clamp(p, 0, 1).toFixed(4)); });
      root.querySelectorAll('[data-stack]').forEach(st => {
        const r = st.getBoundingClientRect();
        const sp = clamp((vh * 0.3 - r.top) / Math.max(1, r.height - vh * 0.5), 0, 1);
        st.style.setProperty('--sp', sp.toFixed(4));
        const cards = st.querySelectorAll('[data-card]'); const n = cards.length;
        cards.forEach((c, i) => {
          const start = i / n; const k = clamp((sp - start) / Math.max(0.0001, 1 - start), 0, 1);
          const target = 1 - (n - 1 - i) * 0.045;
          c.style.setProperty('--sc', this.reduce ? '1' : (1 - k * (1 - target)).toFixed(4));

      this.onMove = e => {
        // luz de fondo que sigue al mouse + paralaje de las partículas
        const rr = root.getBoundingClientRect();
        root.style.setProperty('--gx', (e.clientX - rr.left).toFixed(0) + 'px');

        root.style.setProperty('--go', '1');
        const vw = window.innerWidth || 1440, vh2 = window.innerHeight || 800;
        root.style.setProperty('--mx', (e.clientX / vw - 0.5).toFixed(3));
        root.style.setProperty('--my', (e.clientY / vh2 - 0.5).toFixed(3));
        // solo el botón más cercano al cursor se mueve, con recorrido limitado: nunca se enciman
        const els = Array.from(root.querySelectorAll('[data-mag]'));
        let best = null, bestD = Infinity;
        els.forEach(el => {
          const r = el.getBoundingClientRect(); const pad = 36;

          if (!inside) return;

            el.style.transform = '';
          }
        });

    }
  }
  startChat() {
